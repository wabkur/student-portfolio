
<!DOCTYPE html>

    <main>

        <!-- Planner Introduction -->
        <section class="planner-hero">

            <h1>My Academic Planner</h1>

            <p>
                Organize your academic activities, manage
                your study tasks and keep track of your progress.
            </p>

        </section>

        <!-- Task Management Section -->
        <section class="planner-container">

            <h2>Manage Your Tasks</h2>

            <!-- Task Input -->
            <div class="task-input">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter an academic task..."
                >

                <button id="addTaskBtn">
                    Add Task
                </button>

            </div>

            <!-- Task List -->
            <ul id="taskList">

            </ul>
