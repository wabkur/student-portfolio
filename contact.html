
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact me through my student portfolio">

    <title>Contact Me | Student Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <nav>
            <h2>MyPortfolio</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="planner.html">Academic</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- Contact Introduction -->
        <section class="contact-hero">

            <h1>Contact Me</h1>

            <p>
                Have a question, suggestion or opportunity?
                Feel free to get in touch with me.
            </p>

        </section>

        <!-- Contact Form Section -->
        <section class="contact-container">

            <h2>Send Me a Message</h2>

            <form id="contactForm">

                <!-- Name Field -->
                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                </div>

                <!-- Email Field -->
                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="text"
                        id="email"
                        placeholder="Enter your email address"
                    >

                </div>

                <!-- Phone Field -->
                <div class="form-group">

                    <label for="phone">Phone Number</label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter your phone number"
                    >

                </div>

                <!-- Message Field -->
                <div class="form-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        rows="5"
                        placeholder="Write your message here..."
                    ></textarea>

                </div>

                <!-- Submit Button -->
                <button type="submit">
                    Send Message
                </button>

                <!-- Form Feedback -->
                <p id="formMessage"></p>

            </form>

        </section>

    </main>

    <!-- Website Footer -->
    <footer>
        <p>&copy; 2025 MIVA Open University All Rights Reserved</p>
    </footer>

    <script src="js/contact.js"></script>

</body>

</html>
